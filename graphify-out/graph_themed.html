<style>

  body { background: #0f0f1a; color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; display: flex; height: 100vh; overflow: hidden; }
  #graph { flex: 1; }
  #sidebar { width: 280px; background: #1a1a2e; border-left: 1px solid #2a2a4e; display: flex; flex-direction: column; overflow: hidden; }
  #search-wrap { padding: 12px; border-bottom: 1px solid #2a2a4e; }
  #search { width: 100%; background: #0f0f1a; border: 1px solid #3a3a5e; color: #e0e0e0; padding: 7px 10px; border-radius: 6px; font-size: 13px; outline: none; }
  #search:focus { border-color: #4E79A7; }
  #search-results { max-height: 140px; overflow-y: auto; padding: 4px 12px; border-bottom: 1px solid #2a2a4e; display: none; }
  .search-item { padding: 4px 6px; cursor: pointer; border-radius: 4px; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .search-item:hover { background: #2a2a4e; }
  #info-panel { padding: 14px; border-bottom: 1px solid #2a2a4e; min-height: 140px; }
  #info-panel h3 { font-size: 13px; color: #aaa; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; }
  #info-content { font-size: 13px; color: #ccc; line-height: 1.6; }
  #info-content .field { margin-bottom: 5px; }
  #info-content .field b { color: #e0e0e0; }
  #info-content .empty { color: #555; font-style: italic; }
  .neighbor-link { display: block; padding: 2px 6px; margin: 2px 0; border-radius: 3px; cursor: pointer; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-left: 3px solid #333; }
  .neighbor-link:hover { background: #2a2a4e; }
  #neighbors-list { max-height: 160px; overflow-y: auto; margin-top: 4px; }
  #legend-wrap { flex: 1; overflow-y: auto; padding: 12px; }
  #legend-wrap h3 { font-size: 13px; color: #aaa; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.05em; }
  .legend-item { display: flex; align-items: center; gap: 8px; padding: 4px 0; cursor: pointer; border-radius: 4px; font-size: 12px; }
  .legend-item:hover { background: #2a2a4e; padding-left: 4px; }
  .legend-item.dimmed { opacity: 0.35; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }

<style id="jarvis-hud-theme">
/* ═══════════════════════════════════════════════════════════════════════════
   JARVIS HUD — Stark Industries Knowledge Graph
   ═══════════════════════════════════════════════════════════════════════════ */

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0;
  background: #010d14 !important;
  color: #b0eeff !important;
  font-family: 'Rajdhani', 'Segoe UI', sans-serif !important;
  font-size: 14px;
  letter-spacing: 0.03em;
}

/* ── Scan-line veil ──────────────────────────────────────────────────────── */
body::before {
  content: '';
  position: fixed; inset: 0; z-index: 9998; pointer-events: none;
  background: repeating-linear-gradient(
    0deg,
    transparent 0px, transparent 2px,
    rgba(0,212,255,0.016) 2px, rgba(0,212,255,0.016) 4px
  );
  animation: scanMove 10s linear infinite;
}
@keyframes scanMove {
  to { background-position: 0 400px; }
}

/* ── Corner bracket HUD ──────────────────────────────────────────────────── */
body::after {
  content: '';
  position: fixed; inset: 10px; z-index: 9997; pointer-events: none;
  background:
    linear-gradient(#00f5ff,#00f5ff) top    left  / 36px 2px no-repeat,
    linear-gradient(#00f5ff,#00f5ff) top    left  / 2px 36px no-repeat,
    linear-gradient(#00f5ff,#00f5ff) top    right / 36px 2px no-repeat,
    linear-gradient(#00f5ff,#00f5ff) top    right / 2px 36px no-repeat,
    linear-gradient(#00f5ff,#00f5ff) bottom left  / 36px 2px no-repeat,
    linear-gradient(#00f5ff,#00f5ff) bottom left  / 2px 36px no-repeat,
    linear-gradient(#00f5ff,#00f5ff) bottom right / 36px 2px no-repeat,
    linear-gradient(#00f5ff,#00f5ff) bottom right / 2px 36px no-repeat;
  animation: cornerBreathe 4s ease-in-out infinite alternate;
}
@keyframes cornerBreathe {
  from { opacity: 0.55; }
  to   { opacity: 1.0;  filter: drop-shadow(0 0 5px #00f5ff); }
}

/* ── Graph canvas ────────────────────────────────────────────────────────── */
#graph, .vis-network {
  background:
    radial-gradient(ellipse at 35% 45%, rgba(0,100,160,0.14) 0%, transparent 55%),
    radial-gradient(ellipse at 70% 65%, rgba(0,50,90,0.18)  0%, transparent 50%),
    #010d14 !important;
}

/* ── Sidebar ─────────────────────────────────────────────────────────────── */
#sidebar {
  background: linear-gradient(180deg, #000f1e 0%, #010d14 100%) !important;
  border-left: 1px solid rgba(0,212,255,0.28) !important;
  width: 280px;
}

/* ── Search ──────────────────────────────────────────────────────────────── */
#search-wrap { border-bottom: 1px solid rgba(0,212,255,0.28) !important; }

#search {
  background: rgba(0,212,255,0.05) !important;
  border: 1px solid rgba(0,212,255,0.28) !important;
  color: #b0eeff !important;
  font-family: 'Share Tech Mono', monospace !important;
  font-size: 12px !important;
  border-radius: 2px !important;
  outline: none !important;
  letter-spacing: 0.06em;
}
#search::placeholder { color: rgba(176,238,255,0.55) !important; }
#search:focus {
  border-color: #00f5ff !important;
  box-shadow: 0 0 8px rgba(0,212,255,0.4) !important;
}

#search-results { border-bottom: 1px solid rgba(0,212,255,0.28) !important; }
.search-item { font-family: 'Share Tech Mono', monospace !important; font-size: 11px !important; color: #b0eeff !important; border-radius: 2px !important; }
.search-item:hover { background: rgba(0,212,255,0.1) !important; }

/* ── Info panel ──────────────────────────────────────────────────────────── */
#info-panel {
  border-bottom: 1px solid rgba(0,212,255,0.28) !important;
  border-left: 3px solid #00d4ff !important;
}
#info-panel h3 {
  font-family: 'Orbitron', monospace !important;
  color: #00d4ff !important;
  font-size: 10px !important;
  letter-spacing: 0.2em !important;
  text-shadow: 0 0 8px rgba(0,212,255,0.4);
}
#info-content {
  font-family: 'Rajdhani', sans-serif !important;
  color: #b0eeff !important;
  font-size: 13px !important;
}
#info-content b { color: #00f5ff !important; }
#info-content .empty { color: rgba(176,238,255,0.55) !important; font-style: normal !important; font-family: 'Share Tech Mono', monospace !important; font-size: 11px !important; }
.neighbor-link {
  font-family: 'Share Tech Mono', monospace !important;
  font-size: 11px !important;
  color: #b0eeff !important;
  border-radius: 1px !important;
}
.neighbor-link:hover { background: rgba(0,212,255,0.1) !important; }

/* ── Legend ──────────────────────────────────────────────────────────────── */
#legend-wrap { border: none !important; }
#legend-wrap h3 {
  font-family: 'Orbitron', monospace !important;
  color: #00d4ff !important;
  font-size: 10px !important;
  letter-spacing: 0.2em !important;
  text-shadow: 0 0 8px rgba(0,212,255,0.4);
}

.legend-item {
  font-family: 'Share Tech Mono', monospace !important;
  font-size: 11px !important;
  color: #b0eeff !important;
  border-radius: 2px !important;
  letter-spacing: 0.04em;
}
.legend-item:hover { background: rgba(0,212,255,0.08) !important; }
.legend-label { color: #b0eeff !important; }
.legend-count  { color: rgba(176,238,255,0.55) !important; }

/* ── Legend dot → HUD diamond indicator ─────────────────────────────────── */
.legend-dot {
  width: 10px !important;
  height: 10px !important;
  border-radius: 2px !important;       /* square with slight rounding */
  transform: rotate(45deg) !important; /* diamond */
  flex-shrink: 0 !important;
  box-shadow: 0 0 6px currentColor, 0 0 12px currentColor !important;
  border: 1px solid rgba(255,255,255,0.4) !important;
}

/* ── Checkboxes ──────────────────────────────────────────────────────────── */
.legend-cb, #select-all-cb {
  appearance: none !important;
  -webkit-appearance: none !important;
  width: 13px !important;
  height: 13px !important;
  border: 1.5px solid rgba(0,212,255,0.75) !important;
  border-radius: 2px !important;
  background: transparent !important;
  cursor: pointer !important;
  position: relative !important;
  flex-shrink: 0 !important;
}
.legend-cb:checked, #select-all-cb:checked {
  background: #00d4ff !important;
  border-color: #00d4ff !important;
  box-shadow: 0 0 6px rgba(0,212,255,0.4) !important;
}
.legend-cb:checked::after, #select-all-cb:checked::after {
  content: '';
  position: absolute;
  left: 3px; top: 0px;
  width: 4px; height: 7px;
  border: solid #010d14;
  border-width: 0 2px 2px 0;
  transform: rotate(45deg);
}

#legend-controls label { color: rgba(176,238,255,0.55) !important; font-family: 'Share Tech Mono', monospace !important; font-size: 11px !important; }
#legend-controls label:hover { color: #b0eeff !important; }

/* ── Stats bar ───────────────────────────────────────────────────────────── */
#stats {
  border-top: 1px solid rgba(0,212,255,0.28) !important;
  font-family: 'Share Tech Mono', monospace !important;
  font-size: 10px !important;
  color: rgba(176,238,255,0.55) !important;
  letter-spacing: 0.1em;
}

/* ── Tooltip ─────────────────────────────────────────────────────────────── */
.vis-tooltip {
  background: rgba(0,8,18,0.96) !important;
  border: 1px solid #00d4ff !important;
  color: #b0eeff !important;
  font-family: 'Share Tech Mono', monospace !important;
  font-size: 11px !important;
  border-radius: 2px !important;
  box-shadow: 0 0 14px rgba(0,212,255,0.4) !important;
  padding: 7px 11px !important;
  letter-spacing: 0.05em;
}

/* ── Scrollbars ──────────────────────────────────────────────────────────── */
::-webkit-scrollbar { width: 3px; background: #010d14; }
::-webkit-scrollbar-thumb { background: #005f75; }
::-webkit-scrollbar-thumb:hover { background: #00d4ff; }

/* ── Top watermark ───────────────────────────────────────────────────────── */
#jv-wm {
  position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
  z-index: 9996; pointer-events: none;
  font-family: 'Orbitron', monospace;
  font-size: 10px; font-weight: 900;
  letter-spacing: 0.4em; text-transform: uppercase;
  color: #00d4ff; text-shadow: 0 0 10px rgba(0,212,255,0.4), 0 0 24px rgba(0,212,255,0.4);
  opacity: 0.7; white-space: nowrap;
}

/* ── Bottom ticker ───────────────────────────────────────────────────────── */
#jv-tick {
  position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
  z-index: 9996; pointer-events: none;
  font-family: 'Share Tech Mono', monospace; font-size: 9px;
  color: rgba(176,238,255,0.55); letter-spacing: 0.22em; text-transform: uppercase;
  white-space: nowrap; animation: tickAlpha 5s ease-in-out infinite alternate;
}
@keyframes tickAlpha { from { opacity: 0.3; } to { opacity: 0.7; } }

/* ── Arc reactor ─────────────────────────────────────────────────────────── */
#jv-arc {
  position: fixed; bottom: 24px; right: 24px;
  width: 44px; height: 44px; z-index: 9996; pointer-events: none;
}
#jv-arc::before {
  content: ''; position: absolute; inset: 0; border-radius: 50%;
  border: 1.5px solid #00d4ff;
  box-shadow: 0 0 10px rgba(0,212,255,0.4), inset 0 0 10px rgba(0,212,255,0.4);
  animation: arcA 7s linear infinite;
}
#jv-arc::after {
  content: ''; position: absolute; inset: 10px; border-radius: 50%;
  border: 1.5px solid #ffb300; opacity: 0.65;
  animation: arcA 3.5s linear infinite reverse;
}
@keyframes arcA {
  from { transform: rotate(0deg);   border-top-color: transparent; }
  to   { transform: rotate(360deg); border-top-color: transparent; }
}

/* ── Ping dot ────────────────────────────────────────────────────────────── */
#jv-ping {
  position: fixed; top: 22px; right: 20px;
  width: 7px; height: 7px; border-radius: 50%;
  background: #00f5ff; box-shadow: 0 0 6px #00f5ff;
  z-index: 9997; animation: pingP 2s ease-in-out infinite; pointer-events: none;
}
@keyframes pingP { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.2; transform: scale(0.6); } }
</style>

</head>

  <div id="stats">30 nodes &middot; 31 edges &middot; 9 communities</div>
</div>

// HTML-escape helper — prevents XSS when injecting graph data into innerHTML
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// Build vis datasets
const nodesDS = new vis.DataSet(RAW_NODES.map(n => ({
  id: n.id, label: n.label, color: n.color, size: n.size,
  font: n.font, title: n.title,
  _community: n.community, _community_name: n.community_name,
  _source_file: n.source_file, _file_type: n.file_type, _degree: n.degree,
})));

const edgesDS = new vis.DataSet(RAW_EDGES.map((e, i) => ({
  id: i, from: e.from, to: e.to,
  label: '',
  title: e.title,
  dashes: e.dashes,
  width: e.width,
  color: e.color,
  arrows: { to: { enabled: true, scaleFactor: 0.5 } },
})));

const container = document.getElementById('graph');
const network = new vis.Network(container, { nodes: nodesDS, edges: edgesDS }, {
  physics: {
    enabled: true,
    solver: 'forceAtlas2Based',
    forceAtlas2Based: {
      gravitationalConstant: -80,
      centralGravity: 0.006,
      springLength: 140,
      springConstant: 0.06,
      damping: 0.5,
      avoidOverlap: 1.0,
    },
    stabilization: { iterations: 250, fit: true },
  },
  interaction: {
    hover: true,
    tooltipDelay: 80,
    hideEdgesOnDrag: false,
    navigationButtons: false,
    keyboard: false,
  },
  nodes: {
    shape: 'dot',
    borderWidth: 1.5,
    borderWidthSelected: 3,
    shadow: { enabled: true, size: 20, x: 0, y: 0 },
  },
  edges: {
    color: { color: 'rgba(0,212,255,0.30)', highlight: '#00f5ff', hover: '#00d4ff' },
    width: 1.2,
    smooth: { type: 'continuous', roundness: 0.2 },
    selectionWidth: 3,
    shadow: { enabled: true, color: 'rgba(0,212,255,0.25)', size: 8, x: 0, y: 0 },
  },
})

network.once('stabilizationIterationsDone', () => {
  network.setOptions({ physics: { enabled: false } });
});

function showInfo(nodeId) {
  const n = nodesDS.get(nodeId);
  if (!n) return;
  const neighborIds = network.getConnectedNodes(nodeId);
  const neighborItems = neighborIds.map(nid => {
    const nb = nodesDS.get(nid);
    const color = nb ? nb.color.background : '#555';
    return `<span class="neighbor-link" style="border-left-color:${esc(color)}" onclick="focusNode(${JSON.stringify(nid)})">${esc(nb ? nb.label : nid)}</span>`;
  }).join('');
  document.getElementById('info-content').innerHTML = `
    <div class="field"><b>${esc(n.label)}</b></div>
    <div class="field">Type: ${esc(n._file_type || 'unknown')}</div>
    <div class="field">Community: ${esc(n._community_name)}</div>
    <div class="field">Source: ${esc(n._source_file || '-')}</div>
    <div class="field">Degree: ${n._degree}</div>
    ${neighborIds.length ? `<div class="field" style="margin-top:8px;color:#aaa;font-size:11px">Neighbors (${neighborIds.length})</div><div id="neighbors-list">${neighborItems}</div>` : ''}
  `;
}

function focusNode(nodeId) {
  network.focus(nodeId, { scale: 1.4, animation: true });
  network.selectNodes([nodeId]);
  showInfo(nodeId);
}

// Track hovered node — hover detection is more reliable than click params
let hoveredNodeId = null;
network.on('hoverNode', params => {
  hoveredNodeId = params.node;
  container.style.cursor = 'pointer';
});
network.on('blurNode', () => {
  hoveredNodeId = null;
  container.style.cursor = 'default';
});
container.addEventListener('click', () => {
  if (hoveredNodeId !== null) {
    showInfo(hoveredNodeId);
    network.selectNodes([hoveredNodeId]);
  }
});
network.on('click', params => {
  if (params.nodes.length > 0) {
    showInfo(params.nodes[0]);
  } else if (hoveredNodeId === null) {
    document.getElementById('info-content').innerHTML = '<span class="empty">Click a node to inspect it</span>';
  }
});

const searchInput = document.getElementById('search');
const searchResults = document.getElementById('search-results');
searchInput.addEventListener('input', () => {
  const q = searchInput.value.toLowerCase().trim();
  searchResults.innerHTML = '';
  if (!q) { searchResults.style.display = 'none'; return; }
  const matches = RAW_NODES.filter(n => n.label.toLowerCase().includes(q)).slice(0, 20);
  if (!matches.length) { searchResults.style.display = 'none'; return; }
  searchResults.style.display = 'block';
  matches.forEach(n => {
    const el = document.createElement('div');
    el.className = 'search-item';
    el.textContent = n.label;
    el.style.borderLeft = `3px solid ${n.color.background}`;
    el.style.paddingLeft = '8px';
    el.onclick = () => {
      network.focus(n.id, { scale: 1.5, animation: true });
      network.selectNodes([n.id]);
      showInfo(n.id);
      searchResults.style.display = 'none';
      searchInput.value = '';
    };
    searchResults.appendChild(el);
  });
});
document.addEventListener('click', e => {
  if (!searchResults.contains(e.target) && e.target !== searchInput)
    searchResults.style.display = 'none';
});

const hiddenCommunities = new Set();

const selectAllCb = document.getElementById('select-all-cb');

function updateSelectAllState() {
  const total = LEGEND.length;
  const hidden = hiddenCommunities.size;
  selectAllCb.checked = hidden === 0;
  selectAllCb.indeterminate = hidden > 0 && hidden < total;
}

function toggleAllCommunities(hide) {
  document.querySelectorAll('.legend-item').forEach(item => {
    hide ? item.classList.add('dimmed') : item.classList.remove('dimmed');
  });
  document.querySelectorAll('.legend-cb').forEach(cb => {
    cb.checked = !hide;
  });
  LEGEND.forEach(c => {
    if (hide) hiddenCommunities.add(c.cid); else hiddenCommunities.delete(c.cid);
  });
  const updates = RAW_NODES.map(n => ({ id: n.id, hidden: hide }));
  nodesDS.update(updates);
  updateSelectAllState();
}

const legendEl = document.getElementById('legend');
LEGEND.forEach(c => {
  const item = document.createElement('div');
  item.className = 'legend-item';
  const cb = document.createElement('input');
  cb.type = 'checkbox';
  cb.className = 'legend-cb';
  cb.checked = true;
  cb.addEventListener('change', (e) => {
    e.stopPropagation();
    if (cb.checked) {
      hiddenCommunities.delete(c.cid);
      item.classList.remove('dimmed');
    } else {
      hiddenCommunities.add(c.cid);
      item.classList.add('dimmed');
    }
    const updates = RAW_NODES
      .filter(n => n.community === c.cid)
      .map(n => ({ id: n.id, hidden: !cb.checked }));
    nodesDS.update(updates);
    updateSelectAllState();
  });
  item.innerHTML = `<div class="legend-dot" style="background:${c.color}"></div>
    <span class="legend-label">${c.label}</span>
    <span class="legend-count">${c.count}</span>`;
  item.prepend(cb);
  item.onclick = (e) => {
    if (e.target === cb) return;
    cb.checked = !cb.checked;
    cb.dispatchEvent(new Event('change'));
  };
  legendEl.appendChild(item);
});
</script>
<script>
// Render hyperedges as shaded regions
const hyperedges = [];
// afterDrawing passes ctx already transformed to network coordinate space.
// Draw node positions raw — no manual pan/zoom/DPR math needed.
network.on('afterDrawing', function(ctx) {
    hyperedges.forEach(h => {
        const positions = h.nodes
            .map(nid => network.getPositions([nid])[nid])
            .filter(p => p !== undefined);
        if (positions.length < 2) return;
        ctx.save();
        ctx.globalAlpha = 0.12;
        ctx.fillStyle = '#6366f1';
        ctx.strokeStyle = '#6366f1';
        ctx.lineWidth = 2;
        ctx.beginPath();
        // Centroid and expanded hull in network coordinates
        const cx = positions.reduce((s, p) => s + p.x, 0) / positions.length;
        const cy = positions.reduce((s, p) => s + p.y, 0) / positions.length;
        const expanded = positions.map(p => ({
            x: cx + (p.x - cx) * 1.15,
            y: cy + (p.y - cy) * 1.15
        }));
        ctx.moveTo(expanded[0].x, expanded[0].y);
        expanded.slice(1).forEach(p => ctx.lineTo(p.x, p.y));
        ctx.closePath();
        ctx.fill();
        ctx.globalAlpha = 0.4;
        ctx.stroke();
        // Label
        ctx.globalAlpha = 0.8;
        ctx.fillStyle = '#4f46e5';
        ctx.font = 'bold 11px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(h.label, cx, cy - 5);
        ctx.restore();
    });
});
</script>

<script id="jarvis-node-shadows">
// Apply per-node glowing shadow matching each node's community colour.
// Runs after stabilisation so the DataSet is fully populated.
(function waitForNetwork() {
  // vis.js exposes the Network instance on the container element
  var container = document.getElementById('graph');
  var net = container && container.__vis_network__;

  // Fallback: read from a globally-scoped var (works if page uses `var`)
  if (!net && typeof network !== 'undefined') net = network;

  if (!net) {
    // Try the container's internal reference (vis-network v9 stores it here)
    var divs = document.querySelectorAll('#graph');
    for (var i = 0; i < divs.length; i++) {
      var keys = Object.keys(divs[i]);
      for (var k = 0; k < keys.length; k++) {
        if (keys[k].startsWith('__vis') || keys[k].startsWith('_vis')) {
          net = divs[i][keys[k]]; break;
        }
      }
      if (net) break;
    }
  }

  if (!net || !net.body || !net.body.data || !net.body.data.nodes) {
    setTimeout(waitForNetwork, 200);
    return;
  }

  var updates = [];
  net.body.data.nodes.forEach(function(node) {
    var col = node.color && node.color.background ? node.color.background : '#00d4ff';
    updates.push({
      id: node.id,
      shadow: { enabled: true, color: col + 'cc', size: 22, x: 0, y: 0 },
    });
  });
  if (updates.length) net.body.data.nodes.update(updates);
})();
</script>


<script id="jarvis-hud-overlay">
(function () {
  function injectHUD() {
    if (document.getElementById('jv-wm')) return;

    function el(tag, id, text) {
      var d = document.createElement(tag);
      d.id = id;
      if (text) d.textContent = text;
      document.body.appendChild(d);
      return d;
    }

    el('div', 'jv-wm',   'STARK INDUSTRIES  ·  KNOWLEDGE GRAPH  ·  J.A.R.V.I.S.');
    el('div', 'jv-arc');
    el('div', 'jv-ping');

    var tick = el('div', 'jv-tick', '');
    var msgs = [
      'SYSTEM ONLINE  ·  THREAT LEVEL: NONE  ·  ALL SYSTEMS NOMINAL',
      'SCANNING NETWORK TOPOLOGY  ·  30 NODES  ·  31 EDGES MAPPED',
      'STARK TECH  ·  PROBABILITY ENGINE ACTIVE  ·  STANDING BY',
      'SUIT INTEGRITY: 100%  ·  ARC REACTOR: OPTIMAL  ·  READY',
      'ANALYSIS COMPLETE  ·  NO ANOMALIES DETECTED  ·  PROCEED',
    ];
    var mi = 0;
    tick.textContent = msgs[0];
    setInterval(function () { mi = (mi + 1) % msgs.length; tick.textContent = msgs[mi]; }, 5000);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', injectHUD);
  } else {
    injectHUD();
  }
})();
</script>
